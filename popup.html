<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 14px;
      background-color: #f8f9fa;
      color: #202124;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 4px;
      font-size: 16px;
      font-weight: 600;
      color: #1a73e8;
    }
    .subtitle {
      font-size: 11px;
      color: #5f6368;
      margin-bottom: 14px;
      word-break: break-all;
      font-family: monospace;
      background-color: #e8eaed;
      padding: 4px 6px;
      border-radius: 4px;
      display: inline-block;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button.main-btn {
      width: 100%;
      padding: 11px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      transition: background-color 0.2s, box-shadow 0.2s;
    }
    button.main-btn:hover {
      background-color: #1557b0;
      box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
    }
    button.main-btn:active {
      background-color: #174ea6;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #dadce0;
      border-radius: 6px;
      background: white;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border-bottom: 1px solid #f1f3f4;
      font-size: 11px;
    }
    li:last-child {
      border-bottom: none;
    }
    .rule-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
      font-family: Consolas, Monaco, monospace;
      color: #c5221f;
      background-color: #fce8e6;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #70757a;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .delete-btn:hover {
      color: #d93025;
    }
    .action-btn {
      background: none;
      border: none;
      color: #1a73e8;
      cursor: pointer;
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      margin-right: 4px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      transition: background-color 0.15s;
    }
    .action-btn:hover {
      background-color: #e8f0fe;
    }
    .empty-state {
      font-size: 12px;
      color: #80868b;
      text-align: center;
      padding: 20px 8px;
    }
    .footer-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      border-top: 1px solid #dadce0;
      padding-top: 12px;
    }
    .sec-btn {
      flex: 1;
      padding: 6px 8px;
      background-color: #fff;
      color: #1a73e8;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .sec-btn:hover {
      background-color: #f8f9fa;
      border-color: #1a73e8;
    }
    #import-file-input {
      display: none;
    }
  </style>
</head>
<body>
  <h3 id="app-name">ClickBlock</h3>
  <div class="subtitle" id="domain-info">Loading domain...</div>
  
  <button class="main-btn" id="select-btn">Select Element to Block</button>
  
  <div class="section-title" id="local-rules-title">Blocked on this Site</div>
  <ul id="local-rules-list">
    <!-- Local Rules injected dynamically -->
  </ul>

  <div class="section-title" id="global-rules-title">Global Blocked Rules</div>
  <ul id="global-rules-list">
    <!-- Global Rules injected dynamically -->
  </ul>

  <div class="footer-actions">
    <button class="sec-btn" id="export-btn">Export Rules</button>
    <button class="sec-btn" id="import-btn-label">Import Rules</button>
    <input type="file" id="import-file-input" accept=".json" />
  </div>

  <script src="popup.js"></script>
</body>
</html>
